<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SORTIE — theatre spike</title>
<style>
  :root{
    --bg:#0B0E12; --panel:#12161C; --line:#232B35; --ink:#D6DEE7; --ink-dim:#93A1AE;
    --accent:#FF6A1F; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;
    display:flex;flex-direction:column;gap:10px;padding:12px;overflow:hidden}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:14px;letter-spacing:.16em;margin:0;text-transform:uppercase}
  h1 span{color:var(--accent)}
  .sub{color:var(--ink-dim);font-size:11px}
  #stagewrap{flex:1;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
  canvas{width:100%;height:100%;display:block}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 12px;border-radius:4px;background:transparent;color:var(--ink-dim);
    border:1px solid var(--line);cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--ink-dim)}
  .btn.on{color:var(--accent);border-color:var(--accent)}
  input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
  #status{color:var(--ink-dim);font-size:11px;min-height:15px}
</style>
</head>
<body>
  <header>
    <h1>SORTIE <span>theatre</span></h1>
    <span class="sub">One engagement, performed. Same beats in every age — only the vocabulary changes.</span>
  </header>
  <div class="bar" id="eras"></div>
  <div id="stagewrap"><canvas id="stage"></canvas></div>
  <div class="bar">
    <button class="btn" id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1250" value="0" step="1" aria-label="Scrub the engagement">
  </div>
  <div id="status"></div>
  <script type="module" src="./theatre/main.ts"></script>
</body>
</html>
